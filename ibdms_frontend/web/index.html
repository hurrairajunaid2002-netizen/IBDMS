<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Intelligent Blood Donor Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IBDMS">

  <meta name="google-signin-client_id"
        content="162061946822-5bapdpta1k3kjt240ub1pi9rugtm9pte.apps.googleusercontent.com">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>IBDMS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .loading-logo {
      width: 52px; height: 52px;
      background: #DC2626;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .loading-logo svg { width: 28px; height: 28px; fill: white; }

    .loading-title {
      font-size: 20px; font-weight: 800;
      color: #1E293B; letter-spacing: -0.5px;
    }

    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid #FEE2E2;
      border-top-color: #DC2626;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C12 2 5 10.5 5 15a7 7 0 0014 0C19 10.5 12 2 12 2z"/>
      </svg>
    </div>
    <div class="loading-title">IBDMS</div>
    <div class="loading-spinner"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    function hideLoader() {
      var screen = document.getElementById('loading-screen');
      if (screen && !screen.classList.contains('hidden')) {
        screen.classList.add('hidden');
        setTimeout(function () { screen.remove(); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
  </script>
</body>
</html>
